# Hexo Configuration
## Docs: https://hexo.io/docs/configuration.html
## Source: https://github.com/hexojs/hexo/

# Site
title: Louis Tsai Blog
subtitle: ''
description: 'EVM Research & Web3 Security Blog'
keywords:
author: Louis Tsai
language: en
timezone: ''

# OpenGraph and Social Media Meta Tags
## Default site image for social sharing
default_og_image: /images/preview.png
## Twitter username
twitter: 0xlouistsai

# URL
## Set your site url here. For example, if you use GitHub Page, set url as 'https://username.github.io/project'
url: https://louistsai.com
root: /
permalink: :year/:month/:day/:category/:title/
permalink_defaults:
pretty_urls:
  trailing_index: true # Set to false to remove trailing 'index.html' from permalinks
  trailing_html: true # Set to false to remove trailing '.html' from permalinks

# Canonical URLs for SEO
## Prevent duplicate content issues
canonical_url: true
enforce_ssl: true

# Directory
source_dir: source
public_dir: public
tag_dir: tags
archive_dir: archives
category_dir: categories
code_dir: downloads/code
i18n_dir: :lang
skip_render:

# Writing
new_post_name: :title.md # File name of new posts
default_layout: post
titlecase: false # Transform title into titlecase
external_link:
  enable: true # Open external links in new tab
  field: site # Apply to the whole site
  exclude: ''
filename_case: 0
render_drafts: false
post_asset_folder: false
relative_link: false
future: true
syntax_highlighter: highlight.js
highlight:
  line_number: true
  auto_detect: false
  tab_replace: ''
  wrap: true
  hljs: false
prismjs:
  preprocess: true
  line_number: true
  tab_replace: ''

# Home page setting
# path: Root path for your blogs index page. (default = '')
# per_page: Posts displayed per page. (0 = disable pagination)
# order_by: Posts order. (Order by date descending by default)
index_generator:
  path: ''
  per_page: 10
  order_by: -date

# Category & Tag
default_category: uncategorized
category_map:
tag_map:

# Metadata elements
## https://developer.mozilla.org/en-US/docs/Web/HTML/Element/meta
meta_generator: true

# Date / Time format
## Hexo uses Moment.js to parse and display date
## You can customize the date format as defined in
## http://momentjs.com/docs/#/displaying/format/
date_format: YYYY-MM-DD
time_format: HH:mm:ss
## updated_option supports 'mtime', 'date', 'empty'
updated_option: 'mtime'

# Pagination
## Set per_page to 0 to disable pagination
per_page: 10
pagination_dir: page

# Include / Exclude file(s)
## include:/exclude: options only apply to the 'source/' folder
include:
exclude:
ignore:


# Extensions
## Plugins: https://hexo.io/plugins/
## Themes: https://hexo.io/themes/
theme: redefine


# Deployment
## Docs: https://hexo.io/docs/one-command-deployment
deploy:
  type: ''

# Responsive images
responsive_images:
  pattern: '**/*.{jpg,jpeg,png,gif}'
  engine: 'sharp'
  sizes:
    small:
      width: 480
      quality: 80
    medium:
      width: 800
      quality: 85
    large:
      width: 1200
      quality: 90
  formats:
    webp:
      quality: 80
    avif:
      quality: 70
      effort: 6
  # Generate original formats alongside optimized ones
  generate_srcset: true
  # Force WebP generation for all images
  optimize_all: true
  # Convert original images to WebP by default
  default_format: 'webp'
  lazy_loading: true

# Sitemap
sitemap:
  path: sitemap.xml
  rel: false
  tags: true
  categories: true

# Robots.txt
robotstxt:
  useragent: "*"
  disallow:
    - /js/
    - /css/
    - /fonts/
    - /images/loading.svg
  allow:
    - /images/
  sitemap: https://louistsai.com/sitemap.xml

# Search Database
search:
  path: search.xml
  field: post
  content: true
  format: html

# RSS Feed
feed:
  enable: true
  type: atom
  path: atom.xml
  limit: 20
  hub:
  content: true
  content_limit: 140
  content_limit_delim: ' '
  order_by: -date
  icon: /images/Dog.jpg
  autodiscovery: true

# Automatic nofollow for external links
nofollow:
  enable: true
  field: site
  exclude: []

# Minification
html_minifier:
  enable: true
  ignore_error: false
  exclude:
    - '*.min.html'
  silent: false
  options:
    removeComments: true
    collapseWhitespace: true
    removeAttributeQuotes: false
    removeEmptyAttributes: true
    minifyJS: true
    minifyCSS: true

clean_css:
  enable: true
  exclude:
    - '*.min.css'
  silent: false
  options:
    compatibility: 'ie8'
    level: 2
    inline: ['local']

uglify:
  mangle: true
  output:
  compress:
  exclude:
    - '*.min.js'
